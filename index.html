<title>مكتبة برومتات الصور بالذكاء الاصطناعي</title>
<meta name="description" content="مئات برومتات الترند لعمل الصور وتعديلها بالذكاء الاصطناعي. انسخ البرومت وجرّبه فورًا.">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1f2430; --muted:#6b7280;
    --primary:#1e5eff; --primary-d:#1648c9; --border:#e3e6ec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:auto;padding:0 14px}

  /* الهيدر */
  header{background:#fff;border-bottom:1px solid var(--border)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;flex-wrap:wrap}
  .logo{font-size:22px;font-weight:800;color:var(--primary);cursor:pointer}
  nav a{margin-inline-start:14px;color:var(--muted);font-size:15px;cursor:pointer}
  nav a:hover{color:var(--primary)}

  /* البانر */
  .hero{background:linear-gradient(135deg,#1e5eff,#6a3df0);color:#fff;text-align:center;padding:38px 14px}
  .hero h1{font-size:26px;margin-bottom:8px}
  .hero p{opacity:.9;margin-bottom:18px}
  .search{max-width:520px;margin:auto}
  .search input{width:100%;padding:13px 16px;border:0;border-radius:10px;font-size:16px;font-family:inherit;outline:none}

  /* التصنيفات */
  .cats{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 6px}
  .cat{padding:7px 16px;border:1px solid var(--border);background:#fff;border-radius:20px;cursor:pointer;font-size:14px;font-family:inherit}
  .cat.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* الشبكة */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:14px 0 30px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
  .card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .thumb{aspect-ratio:4/5;background:linear-gradient(135deg,#dfe7ff,#efe3ff);display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .card-body{padding:12px}
  .card-body h3{font-size:16px;margin-bottom:6px}
  .tag{display:inline-block;font-size:12px;background:#eef2ff;color:var(--primary);padding:2px 10px;border-radius:12px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}

  /* صفحة البرومت */
  .detail{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin:20px 0}
  .back{display:inline-block;margin:16px 0 0;color:var(--primary);cursor:pointer;font-size:15px}
  .d-wrap{display:grid;grid-template-columns:320px 1fr;gap:20px}
  .d-img{border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#dfe7ff,#efe3ff);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;font-size:60px}
  .d-img img{width:100%;height:100%;object-fit:cover}
  .d-info h2{font-size:22px;margin-bottom:8px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .promptbox{background:#f8f9fb;border:1px dashed #b8c2d6;border-radius:10px;padding:14px;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .note{background:#fff8e1;border:1px solid #ffe08a;border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:12px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{padding:11px 22px;border:0;border-radius:8px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:600}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-light{background:#eef2ff;color:var(--primary)}
  h2.sec{font-size:19px;margin:22px 0 4px}

  /* الصفحات الثابتة */
  .page{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px;margin:20px 0}
  .page h2{margin-bottom:10px}
  .page p{margin-bottom:10px;color:#374151}

  /* الفوتر */
  footer{background:#1f2430;color:#cbd2e0;text-align:center;padding:22px 14px;margin-top:30px;font-size:14px}
  footer a{margin:0 10px;cursor:pointer;color:#fff}

  /* رسالة النسخ */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;padding:10px 22px;border-radius:24px;font-size:15px;transition:.3s;z-index:100000;opacity:0}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  @media(max-width:700px){
    .d-wrap{grid-template-columns:1fr}
    .hero h1{font-size:21px}
    .grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .card-body h3{font-size:14px}
  }
</style>
</head>
